<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI 입력정보 보호</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="panel">
      <p class="eyebrow">AI 입력정보 보호 게이트웨이</p>
      <h1>입력 감지 실험</h1>
      <p class="status" role="status">
        <span class="status-indicator" aria-hidden="true"></span>
        프로토타입 준비됨 — 대상 사이트에서 확인 필요
      </p>

      <section aria-labelledby="scope-heading">
        <h2 id="scope-heading">현재 동작</h2>
        <p>ChatGPT와 Claude의 텍스트 입력·붙여넣기 이벤트가 발생하면 페이지에 임시 알림을 표시합니다. 입력 글자 자체는 읽거나 저장·전송하지 않습니다.</p>
      </section>

      <p class="notice">
        아직 개인정보·기밀 탐지, 마스킹, 승인, 차단 기능은 없습니다. 입력은 AI 서비스로 그대로 전송될 수 있으므로 민감정보 대신 테스트 문구로 확인하세요.
      </p>
    </main>
  </body>
</html>
