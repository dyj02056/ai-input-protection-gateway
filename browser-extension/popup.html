<!doctype html>
<html lang="ko">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI 입력정보 보호</title>
    <link rel="stylesheet" href="popup.css">

  <body>
    <main class="panel">
      <p class="eyebrow">AI 입력정보 보호 게이트웨이</p>

      <section aria-labelledby="scope-heading">

        <p>Manifest V3 확장 프로그램의 기본 틀을 준비했습니다.</p>
      </section>

      <p class="notice">
        아직 입력 감시, 개인정보 탐지, 마스킹, 승인 또는 차단 기능은 동작하지 않습니다.
