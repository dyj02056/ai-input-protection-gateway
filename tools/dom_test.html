<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>content.js DOM 회귀 테스트</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; }
  /* 실제 편집기처럼 문단마다 아래 여백이 있는 상황을 흉내 냅니다. */
  #editor { white-space: pre-wrap; padding: 8px; }
  #editor p, #editor div.block { margin: 0 0 8px; }
</style>
</head>
<body>
<div id="editor" contenteditable="true"></div>
<form id="form" action="#">
  <input id="apikey" type="text" aria-label="메시지 입력">
  <button id="send" type="submit">보내기</button>
</form>
<pre id="out"></pre>
<script>
  // 확장 API 스텁. content.js가 저장소와 서비스 워커를 쓰기 때문입니다.
  // 저장소와 onChanged를 실제로 구현해야 content.js의 기능 켜기/끄기가 그대로 재현됩니다.
  const store = {
    enabled: null,
    features: {
      persistentAlert: true,
      autoCloseWhenClean: true,
      resultAutoHideMs: 8000,
      noticePosition: "top-right",
      undoButton: true,
      auditLog: false,
      enforcePolicy: false,
      blockSend: false,
      requireConfirm: false,
    },
    history: [],
  };
  const changeListeners = [];

  window.chrome = {
    storage: {
      local: {
        get(defaults, callback) {
          const keys = defaults && typeof defaults === "object" ? defaults : {};
          const result = {};
          for (const [key, fallback] of Object.entries(keys)) {
            result[key] = Object.prototype.hasOwnProperty.call(store, key)
              ? store[key]
              : fallback;
          }
          if (callback) callback(result);
        },
        set(values, callback) {
          const changes = {};
          for (const [key, value] of Object.entries(values || {})) {
            changes[key] = { oldValue: store[key], newValue: value };
            store[key] = value;
          }
          for (const listener of changeListeners) listener(changes, "local");
          if (callback) callback();
        },
        remove(keys, callback) {
          for (const key of [].concat(keys)) {
            delete store[key];
            changeListeners.forEach((listener) =>
              listener({ [key]: { oldValue: undefined, newValue: undefined } }, "local"),
            );
          }
          if (callback) callback();
        },
      },
      onChanged: {
        addListener(fn) {
          changeListeners.push(fn);
        },
      },
    },
    runtime: {
      lastError: null,
      sendMessage(message, callback) { if (callback) callback(); },
    },
  };

  // content.js는 알림창을 닫힌 shadow root에 그립니다.
  // 테스트에서 버튼을 누를 수 있도록 열린 shadow root로 바꿔 끼웁니다.
  const nativeAttachShadow = Element.prototype.attachShadow;
  Element.prototype.attachShadow = function (init) {
    return nativeAttachShadow.call(this, Object.assign({}, init, { mode: "open" }));
  };
</script>
<script src="../dist-ext/detector.js"></script>
<script src="../dist-ext/policy.js"></script>
<script src="../dist-ext/content.js"></script>
<script>
(async () => {
  "use strict";

  const editor = document.getElementById("editor");
  const out = document.getElementById("out");
  const form = document.getElementById("form");
  const apiInput = document.getElementById("apikey");
  const sendButton = document.getElementById("send");
  const results = [];
  const failures = [];

  function check(label, actual, expected) {
    const ok = actual === expected;
    results.push({ label, ok, actual, expected });
    if (!ok) {
      failures.push(label);
    }
  }

  function finish() {
    out.textContent = JSON.stringify(
      { total: results.length, failures, results },
      null,
      2,
    );
  }

  function noticeHost() {
    return document.querySelector("[data-ai-input-gateway-notice]");
  }

  function noticePart(selector) {
    const host = noticeHost();
    return host && host.shadowRoot ? host.shadowRoot.querySelector(selector) : null;
  }

  function noticeTitle() {
    const title = noticePart(".message strong");
    return title ? title.textContent : "안내 없음";
  }

  // 설정 화면에서 토글을 켜는 것과 같은 효과입니다. content.js는 onChanged로 반영합니다.
  function setFeatures(patch) {
    window.chrome.storage.local.set({
      features: Object.assign({}, store.features, patch),
    });
  }

  function typeInto(target, value) {
    if (target instanceof HTMLInputElement) {
      target.value = value;
      target.dispatchEvent(new InputEvent("input", { bubbles: true, composed: true }));
      return;
    }
    target.innerHTML = value;
    target.dispatchEvent(new InputEvent("input", { bubbles: true, composed: true }));
  }

  const sleep = (ms) => new Promise((resolve) => window.setTimeout(resolve, ms));

  // 화면에 실제로 그려진 줄 수를 셉니다.
  // innerText는 <p> 경계를 '\n\n'로 세므로 시각적 줄 수의 근거가 될 수 없습니다.
  function visualLineCount(element) {
    const range = document.createRange();
    range.selectNodeContents(element);
    const tops = new Set();
    for (const rect of range.getClientRects()) {
      if (rect.height > 0 && rect.width >= 0) {
        tops.add(Math.round(rect.top));
      }
    }
    return tops.size;
  }

  function breakCount(element) {
    return element.querySelectorAll("br").length;
  }

  // 실제 사용 흐름과 같게 동작시킵니다.
  // 입력 이벤트로 검사를 유발한 뒤, 알림창의 마스킹 버튼을 누릅니다.
  function maskOnce(initialHtml) {
    editor.innerHTML = initialHtml;
    editor.dispatchEvent(new InputEvent("input", { bubbles: true, composed: true }));

    const button = noticePart(".mask-button");
    if (!button) {
      return null;
    }

    button.click();
    return { html: editor.innerHTML, lines: visualLineCount(editor), breaks: breakCount(editor) };
  }

  function caseUsingP(label, initialHtml, expectedHtml, expectedLines) {
    const before = visualLineCount(editor);
    void before;
    const result = maskOnce(initialHtml);
    if (!result) {
      check(label + " (알림 버튼 생성)", "버튼 없음", "버튼 있음");
      return;
    }
    check(label + " (DOM 구조)", result.html, expectedHtml);
    check(label + " (시각적 줄 수)", result.lines, expectedLines);
  }

  const API_KEY = "sk-TESTTESTTESTTESTTEST";
  let submitReachedForm = 0;

  // 차단 여부를 보려면 제출 이벤트가 폼까지 내려왔는지 세어야 합니다.
  // content.js가 막으면 이벤트 전파를 멈추므로 이 카운터가 늘지 않습니다.
  form.addEventListener("submit", (event) => {
    submitReachedForm += 1;
    event.preventDefault();
  });

  // 세션 토큰 마스킹과 답변 화면 복원. 실제 브라우저의 MutationObserver로 확인합니다.
  async function runTokenTests() {
    const defaults = {
      persistentAlert: true, autoCloseWhenClean: true, undoButton: true, noticePosition: "top-right",
      auditLog: false, enforcePolicy: false, blockSend: false, requireConfirm: false, restoreTokens: true,
    };
    setFeatures(defaults);
    window.chrome.storage.local.set({ maskStyle: "token" });
    editor.innerHTML = "";

    // 1. 토큰으로 마스킹: 같은 줄 구조를 지키며 값만 [전화_1]로 바뀝니다.
    typeInto(editor, "<p>연락처 010-1234-5678</p><p>그대로</p>");
    noticePart(".mask-button").click();
    check("토큰 방식: 입력창에 토큰이 들어감", editor.innerHTML, "<p>연락처 [전화_1]</p><p>그대로</p>");
    check(
      "토큰 방식: 안내가 복원 방식을 알림",
      noticePart(".message span").textContent.includes("이 탭의 화면에서만 원래 값으로 보여줍니다"),
      true,
    );

    // 2. AI 답변이 한 글자씩 도착하는 상황을 흉내 냅니다.
    const chat = document.createElement("div");
    chat.innerHTML =
      '<div id="u" data-message-author-role="user">연락처 [전화_1]</div>' +
      '<div id="a" data-message-author-role="assistant"><p></p></div>';
    document.body.append(chat);
    const answerText = document.createTextNode("");
    chat.querySelector("#a p").append(answerText);
    for (const chunk of ["안녕하세요 ", "[전", "화_", "1", "]님"]) {
      answerText.data += chunk;
      await sleep(20);
    }
    check("토큰 방식: 스트리밍된 답변이 원래 값으로 보임", answerText.data, "안녕하세요 010-1234-5678님");
    check("토큰 방식: 노드를 갈아 끼우지 않고 글자만 바꿈", chat.querySelector("#a p").firstChild === answerText, true);
    check("토큰 방식: 내 말풍선은 복원하지 않음", chat.querySelector("#u").textContent, "연락처 [전화_1]");
    check("토큰 방식: 입력창은 토큰 그대로", editor.innerHTML, "<p>연락처 [전화_1]</p><p>그대로</p>");

    // 3. 같은 값은 같은 토큰, 새 값은 새 번호
    typeInto(editor, "<p>다시 010-1234-5678 그리고 010-9999-0000</p>");
    noticePart(".mask-button").click();
    check("토큰 방식: 같은 값은 같은 토큰, 새 값은 새 번호", editor.innerHTML, "<p>다시 [전화_1] 그리고 [전화_2]</p>");

    // 4. 실행 취소
    noticePart(".undo-button").click();
    check("토큰 방식: 실행 취소로 원래 글자", editor.innerHTML, "<p>다시 010-1234-5678 그리고 010-9999-0000</p>");

    // 5. 복원 표시를 끄면 토큰이 그대로 보입니다.
    setFeatures({ restoreTokens: false });
    const answer2 = document.createElement("p");
    answer2.textContent = "[전화_2] 입니다";
    chat.append(answer2);
    await sleep(30);
    check("복원 표시를 끄면 토큰이 그대로 보임", answer2.textContent, "[전화_2] 입니다");

    // 정리: 이후 검사에 영향이 없도록 되돌립니다.
    chat.remove();
    window.chrome.storage.local.set({ maskStyle: "placeholder" });
    setFeatures(defaults);
    editor.innerHTML = "";
  }

  // ---- 첨부파일 검사: 실제 브라우저의 File·DataTransfer·DecompressionStream으로 확인합니다 ----
  function crc32(bytes) {
    let crc = 0xffffffff;
    for (const byte of bytes) {
      crc ^= byte;
      for (let k = 0; k < 8; k += 1) crc = (crc >>> 1) ^ (0xedb88320 & -(crc & 1));
    }
    return (crc ^ 0xffffffff) >>> 0;
  }

  async function deflateRaw(bytes) {
    const stream = new CompressionStream("deflate-raw");
    const writer = stream.writable.getWriter();
    writer.write(bytes);
    writer.close();
    return new Uint8Array(await new Response(stream.readable).arrayBuffer());
  }

  // 최소 ZIP 만들기(DOCX 흉내용). encrypted: 암호화 표시 비트만 켭니다.
  async function buildZip(files) {
    const enc = new TextEncoder();
    const u16 = (v) => [v & 255, (v >> 8) & 255];
    const u32 = (v) => [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255];
    const body = [];
    const central = [];
    for (const file of files) {
      const raw = enc.encode(file.data);
      const packed = await deflateRaw(raw);
      const name = enc.encode(file.name);
      const flags = 0x800 | (file.encrypted ? 1 : 0);
      const crc = crc32(raw);
      const offset = body.length;
      body.push(...u32(0x04034b50), ...u16(20), ...u16(flags), ...u16(8), ...u16(0), ...u16(0x21),
        ...u32(crc), ...u32(packed.length), ...u32(raw.length), ...u16(name.length), ...u16(0), ...name, ...packed);
      central.push(...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(flags), ...u16(8), ...u16(0), ...u16(0x21),
        ...u32(crc), ...u32(packed.length), ...u32(raw.length), ...u16(name.length), ...u16(0), ...u16(0),
        ...u16(0), ...u16(0), ...u32(0), ...u32(offset), ...name);
    }
    const directoryOffset = body.length;
    body.push(...central, ...u32(0x06054b50), ...u16(0), ...u16(0), ...u16(files.length), ...u16(files.length),
      ...u32(central.length), ...u32(directoryOffset), ...u16(0));
    return new Uint8Array(body);
  }

  // 파일 선택창에 파일이 들어온 것처럼 change 이벤트를 보냅니다.
  const fileInput = document.createElement("input");
  fileInput.type = "file";
  document.body.append(fileInput);
  function attachFile(file) {
    const transfer = new DataTransfer();
    transfer.items.add(file);
    fileInput.files = transfer.files;
    fileInput.dispatchEvent(new Event("change", { bubbles: true }));
  }

  async function waitForNotice(predicate, label) {
    for (let i = 0; i < 100; i += 1) {
      if (noticeHost() && predicate(noticeTitle())) return true;
      await sleep(30);
    }
    check(label + " (안내 대기 시간 초과)", noticeTitle(), "안내 표시");
    return false;
  }

  const noticeText = () => {
    const part = noticePart(".message span");
    return part ? part.textContent : "";
  };

  async function runFileTests() {
    const defaults = {
      persistentAlert: true, autoCloseWhenClean: true, undoButton: true, noticePosition: "top-right",
      auditLog: false, enforcePolicy: false, blockSend: false, requireConfirm: false, restoreTokens: true,
      inspectFiles: true, blockFileSend: false,
    };
    setFeatures(defaults);
    editor.innerHTML = "";
    const RESULT = "첨부파일 검사 결과 — 전송 전 확인";
    const notDone = (title) => title !== "첨부파일 검사 중…";

    // 1. CSV: 열 단위 판정과 행 수
    attachFile(new File(["이름,연락처\n김,010-1234-5678\n이,010-2222-3333\n박,010-4444-5555"], "customers.csv"));
    await waitForNotice(notDone, "CSV");
    check("파일: CSV 경고 안내", noticeTitle(), RESULT);
    check("파일: 전화번호 열과 행 수", /전화번호 형식 감지, B열, 감지된 행 3건/.test(noticeText()), true);
    check("파일: 안내에 파일 안의 값이 없음", noticeText().includes("010-1234-5678") || noticeText().includes("김"), false);

    // 2. DOCX: 브라우저 내장 DecompressionStream으로 푼 본문에서 카드번호를 찾는다
    const docx = await buildZip([
      { name: "[Content_Types].xml", data: "<Types/>" },
      { name: "word/document.xml", data: "<w:document><w:body><w:p><w:r><w:t>카드 4111 1111 1111 1111</w:t></w:r></w:p></w:body></w:document>" },
    ]);
    attachFile(new File([docx], "contract.docx"));
    await waitForNotice((title) => notDone(title) && noticeText().includes("contract.docx"), "DOCX");
    check("파일: DOCX 본문에서 카드번호 감지(실제 DecompressionStream)", noticeText().includes("카드번호 형식 감지"), true);

    // 3. 암호화 표시가 있는 ZIP
    const locked = await buildZip([{ name: "a.txt", data: "x", encrypted: true }]);
    attachFile(new File([locked], "locked.zip"));
    await waitForNotice((title) => notDone(title) && noticeText().includes("locked.zip"), "암호화 ZIP");
    check("파일: 암호가 걸린 압축 파일은 검사하지 못했다고 알림", noticeText().includes("암호가 걸린"), true);

    // 4. 깨끗한 파일
    attachFile(new File(["내일 회의는 3시입니다"], "note.txt"));
    await waitForNotice((title) => notDone(title) && noticeText().includes("note.txt"), "깨끗한 파일");
    check("파일: 깨끗한 파일은 완료 안내", noticeTitle(), "첨부파일 검사 완료");

    // 5. 드롭 이벤트: 검사하되 사이트의 동작은 막지 않는다
    const dropTransfer = new DataTransfer();
    dropTransfer.items.add(new File(["a@b.co"], "dropped.txt"));
    const dropEvent = new DragEvent("drop", { dataTransfer: dropTransfer, bubbles: true, cancelable: true });
    document.body.dispatchEvent(dropEvent);
    await waitForNotice((title) => notDone(title) && noticeText().includes("dropped.txt"), "드롭");
    check("파일: 드롭도 검사하고 막지 않음", noticeTitle() === RESULT && dropEvent.defaultPrevented === false, true);

    // 6. 첨부파일 전송 차단: 첫 시도는 막고 5초 안의 재시도는 통과
    editor.innerHTML = "";
    setFeatures({ enforcePolicy: true, blockFileSend: true });
    attachFile(new File(["이름,연락처\n김,010-1234-5678\n이,010-2222-3333"], "block.csv"));
    await waitForNotice((title) => notDone(title) && noticeText().includes("block.csv"), "차단용 파일");
    const before = submitReachedForm;
    sendButton.click();
    check("파일: 위험한 첨부가 있으면 첫 전송 시도를 막음", submitReachedForm, before);
    check("파일: 차단 안내", noticeTitle(), "전송을 막았습니다 — 첨부파일 확인 필요");
    sendButton.click();
    check("파일: 5초 안에 다시 누르면 전송됨(클릭과 제출 모두)", submitReachedForm, before + 1);
    sendButton.click();
    check("파일: 보낸 뒤에는 같은 파일 때문에 다시 막지 않음", submitReachedForm, before + 2);

    // 7. 스위치를 끄면 막지 않는다
    setFeatures({ blockFileSend: false });
    attachFile(new File(["연락처 010-1234-5678"], "off.txt"));
    await waitForNotice((title) => notDone(title) && noticeText().includes("off.txt"), "스위치 끔");
    const beforeOff = submitReachedForm;
    sendButton.click();
    check("파일: 첨부파일 전송 차단이 꺼져 있으면 막지 않음", submitReachedForm, beforeOff + 1);

    // 정리
    setFeatures(defaults);
    editor.innerHTML = "";
  }

  async function runFeatureTests() {
    // 1. 기본값 그대로면 자동으로 막지 않습니다.
    setFeatures({ persistentAlert: true, autoCloseWhenClean: true, undoButton: true, noticePosition: "top-right", auditLog: false, enforcePolicy: false, blockSend: false, requireConfirm: false });
    typeInto(apiInput, API_KEY);
    check("감지 안내 표시", noticeTitle(), "형식 패턴 감지 — 전송 전 확인");
    sendButton.click();
    check("기본값에서는 전송을 막지 않음", submitReachedForm, 1);

    // 2. 정책 적용 + 전송 차단 ON. 첫 시도는 막습니다.
    setFeatures({ enforcePolicy: true, blockSend: true });
    sendButton.click();
    check("첫 전송 시도는 차단", submitReachedForm, 1);
    check("차단 안내 표시", noticeTitle(), "전송을 막았습니다 — 형식 패턴 감지");

    // 3. 5초 안에 다시 누르면 그대로 전송됩니다. 클릭과 그 뒤 제출이 모두 통과해야 합니다.
    sendButton.click();
    check("5초 이내 재시도는 통과", submitReachedForm, 2);

    // 4. 허용 시간이 지나면 다시 막습니다.
    await sleep(5500);
    sendButton.click();
    check("허용 시간이 지나면 다시 차단", submitReachedForm, 2);

    // 5. 막힌 뒤 바로 다시 누르면 통과합니다. 다음 판정을 새 상태에서 시작하게 됩니다.
    sendButton.click();
    check("차단 후 재시도는 통과", submitReachedForm, 3);

    // 6. Enter로 보내기. 막힌 뒤 바로 다시 누르면 통과합니다.
    const enter = new KeyboardEvent("keydown", { key: "Enter", bubbles: true, cancelable: true });
    apiInput.dispatchEvent(enter);
    check("Enter 전송 차단", enter.defaultPrevented, true);
    const enterAgain = new KeyboardEvent("keydown", { key: "Enter", bubbles: true, cancelable: true });
    apiInput.dispatchEvent(enterAgain);
    check("Enter 재시도는 통과", enterAgain.defaultPrevented, false);

    // 7. 폼 밖의 일반 버튼은 전송으로 보지 않습니다.
    const harmless = document.createElement("button");
    harmless.type = "button";
    harmless.textContent = "취소";
    document.body.append(harmless);
    const harmlessClick = new MouseEvent("click", { bubbles: true, cancelable: true });
    harmless.dispatchEvent(harmlessClick);
    check("보내기 아닌 버튼은 통과", harmlessClick.defaultPrevented, false);
    harmless.remove();

    // 8. 전송 차단과 승인 확인은 서로 독립된 스위치입니다.
    setFeatures({ blockSend: false, requireConfirm: true });
    sendButton.click();
    check("승인 확인만 켜면 BLOCK 값은 그대로 전송", submitReachedForm, 4);
    await sleep(5500);
    setFeatures({ blockSend: true, requireConfirm: false });
    sendButton.click();
    check("전송 차단을 켜면 다시 막음", submitReachedForm, 4);
    setFeatures({ blockSend: false, requireConfirm: false });

    // 9. 감사 기록에는 원문이 아니라 범주 ID만 남습니다.
    setFeatures({ auditLog: true, enforcePolicy: false });
    typeInto(apiInput, "010-0000-0000");
    const entry = store.history[store.history.length - 1] || null;
    check("감사 기록 범주", entry ? entry.categories.join(",") : "없음", "phone_number");
    check("감사 기록 조치", entry ? entry.action : "없음", "MASK");
    check("감사 기록에 전화번호 원문 없음", JSON.stringify(store.history).includes("010-0000-0000"), false);
    check("감사 기록에 API 키 원문 없음", JSON.stringify(store.history).includes(API_KEY), false);
    setFeatures({ auditLog: false });

    // 10. 감지 안내는 닫을 때까지 계속 떠 있어야 합니다.
    typeInto(editor, "<p>010-0000-0000</p>");
    check("감지 안내 생성", Boolean(noticeHost()), true);
    await sleep(20000);
    check("20초 뒤에도 감지 안내 유지", Boolean(noticeHost()), true);
    check("20초 뒤 안내 문구 유지", noticeTitle(), "형식 패턴 감지 — 전송 전 확인");

    // 11. 닫기 버튼. 같은 감지는 다시 띄우지 않고, 감지가 사라지면 다시 안내합니다.
    noticePart(".close-button").click();
    check("닫기 버튼으로 안내 제거", noticeHost() === null, true);
    typeInto(editor, "<p>010-0000-0000</p>");
    check("닫은 뒤 같은 감지는 다시 띄우지 않음", noticeHost() === null, true);
    typeInto(editor, "<p>보통 문장</p>");
    typeInto(editor, "<p>010-0000-0000</p>");
    check("감지가 사라졌다 돌아오면 다시 안내", noticeTitle(), "형식 패턴 감지 — 전송 전 확인");

    // 12. 실행 취소로 마스킹 전 문장을 되돌립니다.
    noticePart(".mask-button").click();
    check("마스킹 적용", editor.innerHTML, "<p>[전화번호]</p>");
    noticePart(".undo-button").click();
    check("실행 취소로 원문 복구", editor.innerHTML, "<p>010-0000-0000</p>");

    // 13. 실행 취소를 끄면 버튼을 띄우지 않습니다.
    setFeatures({ undoButton: false });
    typeInto(editor, "<p>010-0000-0000</p>");
    noticePart(".mask-button").click();
    check("실행 취소 꺼지면 버튼 숨김", noticePart(".undo-button").hidden, true);

    // 14. 안내 위치 설정
    setFeatures({ undoButton: true, noticePosition: "bottom-left" });
    typeInto(editor, "<p>010-0000-0000</p>");
    check("안내 위치 적용", noticeHost().dataset.position, "bottom-left");

    // 15. 계속 표시를 끄면 기존처럼 정해진 시간 뒤에 사라집니다.
    setFeatures({ noticePosition: "top-right", persistentAlert: false });
    typeInto(editor, "<p>010-0000-0000</p>");
    check("감지 안내 생성(시간 제한)", Boolean(noticeHost()), true);
    await sleep(9000);
    check("계속 표시 끄면 8초 뒤 닫힘", noticeHost() === null, true);
  }

  try {
    // 1. ChatGPT·Claude처럼 줄마다 <p>를 쓰는 편집기. 보고된 버그의 재현 형태입니다.
    const originalLines = (() => {
      editor.innerHTML = "<p>010-0000-0000</p><p>000000-1000000</p>";
      return visualLineCount(editor);
    })();
    check("원본 <p> 두 줄의 시각적 줄 수", originalLines, 2);

    caseUsingP(
      "<p> 두 줄",
      "<p>010-0000-0000</p><p>000000-1000000</p>",
      "<p>[전화번호]</p><p>[주민등록번호]</p>",
      2,
    );

    // 2. 줄마다 <div>를 쓰는 편집기
    caseUsingP(
      "<div> 두 줄",
      '<div class="block">010-0000-0000</div><div class="block">000000-1000000</div>',
      '<div class="block">[전화번호]</div><div class="block">[주민등록번호]</div>',
      2,
    );

    // 3. <br>로 줄을 나눈 편집기
    caseUsingP(
      "<br> 두 줄",
      "010-0000-0000<br>000000-1000000",
      "[전화번호]<br>[주민등록번호]",
      2,
    );

    // 4. 5줄 예시 문장. 감지되지 않은 줄은 그대로 남아야 합니다.
    const sampleFive = [
      "가짜 주민번호 000000-1000000",
      "가짜 전화번호 010-0000-0000",
      "가짜 이메일 test.user@example.com",
      "가짜 키 sk-TESTTESTTESTTESTTEST",
      "그대로 남아야 할 문장",
    ];
    caseUsingP(
      "5줄 <p>",
      sampleFive.map((line) => `<p>${line}</p>`).join(""),
      [
        "<p>가짜 주민번호 [주민등록번호]</p>",
        "<p>가짜 전화번호 [전화번호]</p>",
        "<p>가짜 이메일 [이메일]</p>",
        "<p>가짜 키 [API 키/토큰]</p>",
        "<p>그대로 남아야 할 문장</p>",
      ].join(""),
      5,
    );

    // 5. 사용자가 직접 만든 빈 줄은 유지되어야 합니다.
    caseUsingP(
      "빈 줄 유지",
      "<p>010-0000-0000</p><p><br></p><p>000000-1000000</p>",
      "<p>[전화번호]</p><p><br></p><p>[주민등록번호]</p>",
      3,
    );

    // 6. 한 줄에 값이 여러 개 있어도 모두 바뀝니다.
    caseUsingP(
      "한 줄에 두 값",
      "<p>010-0000-0000 과 010-1111-2222</p>",
      "<p>[전화번호] 과 [전화번호]</p>",
      1,
    );

    // 7. 값이 여러 인라인 요소에 나뉘어 있어도 바뀝니다.
    caseUsingP(
      "값이 나뉜 줄",
      "<p><span>010-0000-</span><span>0000</span></p>",
      "<p><span>[전화번호]</span><span></span></p>",
      1,
    );

    // 8. 감지된 값이 없으면 아무것도 바뀌지 않습니다.
    const untouched = maskOnce("<p>평범한 테스트 문장</p><p>010-0000-0000</p>");
    check(
      "감지 없는 줄 유지",
      untouched ? untouched.html : "버튼 없음",
      "<p>평범한 테스트 문장</p><p>[전화번호]</p>",
    );
  } catch (error) {
    check("예외 없이 실행", String(error && error.stack ? error.stack : error), "예외 없음");
  }

  try {
    await runFeatureTests();
  } catch (error) {
    check(
      "1.1.0 기능 예외 없이 실행",
      String(error && error.stack ? error.stack : error),
      "예외 없음",
    );
  }

  try {
    await runTokenTests();
  } catch (error) {
    check(
      "세션 토큰 기능 예외 없이 실행",
      String(error && error.stack ? error.stack : error),
      "예외 없음",
    );
  }

  try {
    await runFileTests();
  } catch (error) {
    check(
      "첨부파일 검사 예외 없이 실행",
      String(error && error.stack ? error.stack : error),
      "예외 없음",
    );
  }

  finish();
})().catch((error) => {
  out.textContent = JSON.stringify(
    {
      total: 1,
      failures: ["하네스 자체 오류"],
      results: [
        {
          label: "하네스 자체 오류",
          ok: false,
          actual: String(error && error.stack ? error.stack : error),
          expected: "예외 없음",
        },
      ],
    },
    null,
    2,
  );
});
</script>
</body>
</html>
