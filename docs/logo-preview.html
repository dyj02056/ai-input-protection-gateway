<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로고 A·B·C안 미리보기</title>
<style>
body{font-family:system-ui,sans-serif;max-width:900px;margin:0 auto;padding:24px;color:#16213a;background:#f4f7ff}
.card{background:#fff;border:1px solid #dbe4f3;border-radius:14px;padding:18px;margin-top:14px}
.row{display:flex;gap:18px;align-items:end;flex-wrap:wrap}
.dark{background:#0f1b33;border-radius:10px;padding:12px;display:flex;gap:18px;align-items:end;flex-wrap:wrap}
img{image-rendering:auto}
h2{margin:0 0 10px}
.pick{display:inline-block;margin-top:10px;font-size:13px;color:#5a6b8c}
</style>
</head>
<body>
<p><a href="index.html">홈</a></p>
<h1>로고 A·B·C안 비교</h1>
<div class="card">
<h2>A안: 방패 + 입력 커서</h2>
<div class="row">
<div><img src="../browser-extension/icons/logo-a.svg" width="128" height="128" alt="A안 128px"><p>128px</p></div>
<div><img src="../browser-extension/icons/logo-a.svg" width="48" height="48" alt="A안 48px"><p>48px</p></div>
<div><img src="../browser-extension/icons/logo-a.svg" width="16" height="16" alt="A안 16px"><p>16px</p></div>
</div>
<span class="pick">입력 보호 직관형</span>
</div>
<div class="card">
<h2>B안: 눈 가림막 (마스킹 강조)</h2>
<div class="row">
<div><img src="../browser-extension/icons/logo-b.svg" width="128" height="128" alt="B안 128px"><p>128px</p></div>
<div><img src="../browser-extension/icons/logo-b.svg" width="48" height="48" alt="B안 48px"><p>48px</p></div>
<div><img src="../browser-extension/icons/logo-b.svg" width="16" height="16" alt="B안 16px"><p>16px</p></div>
</div>
<span class="pick">마스킹 기능 강조형</span>
</div>
<div class="card">
<h2>C안: 게이트 (제품명 일치)</h2>
<div class="row">
<div><img src="../browser-extension/icons/logo-c.svg" width="128" height="128" alt="C안 128px"><p>128px</p></div>
<div><img src="../browser-extension/icons/logo-c.svg" width="48" height="48" alt="C안 48px"><p>48px</p></div>
<div><img src="../browser-extension/icons/logo-c.svg" width="16" height="16" alt="C안 16px"><p>16px</p></div>
</div>
<span class="pick">게이트웨이 컨셉형 (추천)</span>
</div>
<div class="card">
<h2>다크 배경 확인</h2>
<div class="dark">
<img src="../browser-extension/icons/logo-a.svg" width="64" height="64" alt="A안 다크 배경">
<img src="../browser-extension/icons/logo-b.svg" width="64" height="64" alt="B안 다크 배경">
<img src="../browser-extension/icons/logo-c.svg" width="64" height="64" alt="C안 다크 배경">
</div>
</div>
</body>
</html>
